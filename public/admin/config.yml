  - name: blog
    label: Blog
    label_singular: Blog post
    icon: edit_note
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug:
      template: '{{title}}'
      editable:
        - create
    preview_path: blog/{{slug}}/
    summary: '{{title}} — {{pubDate | date("MMM D, YYYY")}}{{draft | ternary(" (draft)", "")}}'
    sortable_fields:
      fields:
        - pubDate
        - title
      default:
        field: pubDate
        direction: descending
    fields:
      - name: title
        label: Title
        widget: string
        required: true
      - name: description
        label: Short description
        widget: text
        required: true
        maxlength: 180
        hint: Shown on the blog list and used as the meta description. Aim for 140–160 characters.
      - name: pubDate
        label: Publish date
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: true
      - name: updatedDate
        label: Last updated (optional)
        widget: datetime
        type: date
        format: YYYY-MM-DD
        required: false
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: Comma separated, e.g. seo, geo

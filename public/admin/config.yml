                label: Custom HTML / embed
                widget: object
                summary: Custom HTML
                fields:
                  - name: code
                    label: HTML
                    widget: code
                    default_language: html
                    allow_language_selection: false
                    output_code_only: true
                    required: false
                  - name: style
                    label: Background
                    widget: select

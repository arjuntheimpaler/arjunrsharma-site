            label: Image alt text
            widget: string
            required: false
            hint: Describe the image for screen readers and Google. Needed whenever an image is added.
          - name: primary_label
            label: Main button text
            widget: string
            required: false
          - name: primary_link
            label: Main button link
            widget: string
            required: false
            hint: 'e.g. /contact/ or #enquire (jumps to the form)'
          - name: secondary_label
            label: Second button text
            widget: string
            required: false
          - name: secondary_link
            label: Second button link
            widget: string
            required: false
      - name: sections
        label: Page content (sections)
        label_singular: section
        widget: list
        required: false
        types:
          - name: text
            label: Text
            widget: object
            summary: '{{fields.heading}}'
            fields:
              - name: heading
                label: Heading (H2)
                widget: string
                required: false
              - name: body
                label: Text
                widget: markdown
                required: false
              - name: width
                label: Width
                widget: select
                options:
                  - narrow
                  - wide
                default: narrow
                required: false
              - name: style
                label: Background
                widget: select
                options:
                  - label: Plain
                    value: plain

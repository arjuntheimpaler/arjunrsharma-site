            hint: Add, remove and drag sections to reorder them.
          - name: faq
            label: FAQ section
            widget: object
            collapsed: true
            required: false
            fields:
              - name: heading
                label: Heading
                widget: string
                required: false
                hint: 'Default: "Frequently asked questions"'
              - name: intro
                label: Intro
                widget: text
                required: false
              - name: items
                label: Questions
                widget: list
                required: false
                fields:

                    widget: string
                    required: false
                  - name: source
                    label: Show
                    widget: select
                    options:
                      - label: Blog posts
                        value: blog
                      - label: Videos
                        value: videos
                      - label: Case studies
                        value: case-studies
                    default: blog
                    required: false
                  - name: count
                    label: How many
                    widget: number
                    value_type: int
                    default: 3
                    min: 1
                    max: 12
                    required: false

# Editor (Sveltia CMS) configuration for arjunrsharma.com
# Docs: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: arjuntheimpaler/arjunrsharma-site
  branch: main
  commit_messages:
    create: Create {{collection}} “{{slug}}”
    update: Update {{collection}} “{{slug}}”
    delete: Delete {{collection}} “{{slug}}”
    uploadMedia: Upload “{{path}}”
    deleteMedia: Delete “{{path}}”
site_url: https://arjunrsharma.com
display_url: https://arjunrsharma.com
logo:
  src: /favicon.svg
media_folder: public/images/uploads
public_folder: /images/uploads
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: pages
    label: Pages
    icon: description
    description: Home, About, FAQ, Contact and the Blog / Case Studies / Videos landing pages.
    files:
      - name: home
        label: Home
        file: src/content/pages/home.yml
        fields:
          - name: title
            label: Page title
            widget: string
            required: true
            hint: Used in breadcrumbs and as the H1 if the header heading is empty.
          - name: hero
            label: Header section
            widget: object
            collapsed: false
            required: false
            fields:
              - name: eyebrow
                label: Small label above heading
                widget: string
                required: false
              - name: heading
                label: Main heading (H1)
                widget: string
                required: false
                hint: Leave empty to use the page title.
              - name: subheading
                label: Intro text
                widget: text
                required: false
              - name: image
                label: Header image (optional)
                widget: image
                required: false
              - name: image_alt
                label: Image alt text
                widget: string
                required: false
                hint: Describe the image for screen readers and Google. Needed whenever an image is added.
              - name: primary_label
                label: Main button text
                widget: string
                required: false
              - name: primary_link
                label: Main button link
                widget: string
                required: false
                hint: 'e.g. /contact/ or #enquire (jumps to the form)'
              - name: secondary_label
                label: Second button text
                widget: string
                required: false
              - name: secondary_link
                label: Second button link
                widget: string
                required: false
          - name: sections
            label: Page content (sections)
            label_singular: section
            widget: list
            required: false
            types:
              - name: text
                label: Text
                widget: object
                summary: '{{fields.heading}}'
                fields:
                  - name: heading
                    label: Heading (H2)
                    widget: string
                    required: false
                  - name: body
                    label: Text
                    widget: markdown
                    required: false
                  - name: width
                    label: Width
                    widget: select
                    options:
                      - narrow
                      - wide
                    default: narrow
                    required: false
                  - name: style
                    label: Background
                    widget: select
                    options:
                      - label: Plain
                        value: plain
                      - label: Tinted
                        value: tinted
                      - label: Dark (maroon)
                        value: dark
                    default: plain
                    required: false
                  - name: anchor
                    label: Anchor ID (optional)
                    widget: string
                    required: false
                    hint: Lets you link straight to this section, e.g. "pricing" → /page/#pricing
              - name: text_image
                label: Text + image
                widget: object
                summary: '{{fields.heading}}'
                fields:
                  - name: heading
                    label: Heading (H2)
                    widget: string
                    required: false
                  - name: body
                    label: Text
                    widget: markdown
                    required: false
                  - name: image
                    label: Image
                    widget: image
                    required: false
                  - name: image_alt
                    label: Image alt text
                    widget: string
                    required: false
                    hint: Describe the image for screen readers and Google. Needed whenever an image is added.
                  - name: image_side
                    label: Image side
                    widget: select
                    options:
                      - right
                      - left
                    default: right
                    required: false
                  - name: button_label
                    label: Button text
                    widget: string
                    required: false
                  - name: button_link
                    label: Button link
                    widget: string
                    required: false
                  - name: style
                    label: Background
                    widget: select
                    options:
                      - label: Plain
                        value: plain
                      - label: Tinted
                        value: tinted
                      - label: Dark (maroon)
                        value: dark
                    default: plain
                    required: false
                  - name: anchor
                    label: Anchor ID (optional)
                    widget: string
                    required: false
                    hint: Lets you link straight to this section, e.g. "pricing" → /page/#pricing
              - name: image
                label: Image
                widget: object
                summary: '{{fields.caption}}'
                fields:
                  - name: image
                    label: Image
                    widget: image
                    required: false
                  - name: image_alt
                    label: Image alt text
                    widget: string
                    required: false
                    hint: Describe the image for screen readers and Google. Needed whenever an image is added.
                  - name: caption
                    label: Caption

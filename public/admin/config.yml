  - name: services
    label: Services
    label_singular: Service
    icon: handshake
    description: Service help pages. A service with a parent appears under it, e.g. /services/organic-search/seo/.
    folder: src/content/services
    extension: yml
    format: yml
    create: true
    slug:
      template: '{{title}}'
      editable:
        - create
    identifier_field: title
    summary: '{{title}}{{parent | ternary(" — under ", "")}}{{parent}}'
    sortable_fields:
      fields:
        - order
        - title
      default:
        field: order
        direction: ascending
    fields:
      - name: title
        label: Service name
        widget: string
        required: true
      - name: parent
        label: Parent service
        widget: relation
        collection: services
        value_field: '{{slug}}'
        search_fields:
          - title
        display_fields:
          - title
        required: false
        hint: Leave empty for a top-level service. Choose "Organic Search" for SEO, AEO, GEO, Local SEO.
      - name: order
        label: Order
        widget: number
        value_type: int
        default: 10
        required: false
        hint: Lower numbers show first.
      - name: card_summary
        label: Short summary (for service cards)
        widget: text
        required: false
      - name: draft
        label: Draft (hide from the live site)
        widget: boolean
        default: false
        required: false
      - name: hero
        label: Header section
        widget: object
        collapsed: false
        required: false
        fields:
          - name: eyebrow
            label: Small label above heading
            widget: string
            required: false

                    label: Question
                    widget: string
                    required: true
                  - name: answer
                    label: Answer
                    widget: markdown
                    required: true
                summary: '{{fields.question}}'
                hint: FAQ schema is added automatically.
          - name: form
            label: Enquiry form
            widget: object
            collapsed: true
            required: false
            fields:
              - name: enabled
                label: Show the enquiry form on this page
                widget: boolean
                default: false
                required: false
              - name: heading
                label: Form heading
                widget: string
                required: false
              - name: intro
                label: Form intro
                widget: text
                required: false
              - name: service_name
                label: Service name (shown in your enquiry emails)
                widget: string
                required: false
              - name: button_label
                label: Button text
                widget: string
                required: false
          - name: seo
            label: SEO & social sharing (meta, OG tags)
            widget: object
            collapsed: true
            required: false
            fields:
              - name: meta_title
                label: Meta title
                widget: string
                required: false
                hint: Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title.
                maxlength: 75
              - name: meta_description
                label: Meta description
                widget: text
                required: false
                hint: Shown under the title in Google. Aim for 140–160 characters.
                maxlength: 180
              - name: canonical
                label: Canonical URL
                widget: string
                required: false
                hint: Leave empty (recommended). Only fill if this page duplicates another URL.
              - name: noindex
                label: Hide this page from Google (noindex)
                widget: boolean
                default: false
                required: false
              - name: og_title
                label: OG title
                widget: string
                required: false
                hint: Title when shared on LinkedIn, WhatsApp, X, etc. Leave empty to use the meta title.
              - name: og_description
                label: OG description
                widget: text
                required: false
                hint: Leave empty to use the meta description.
              - name: og_image
                label: OG image
                widget: image
                required: false
                hint: 1200 × 630 px works best. Leave empty to use the page image or the site default.
              - name: og_image_alt
                label: OG image alt text
                widget: string
                required: false
                hint: Describe the image for screen readers and Google. Needed whenever an image is added.
          - name: schema
            label: Schema (structured data)
            widget: object
            collapsed: true
            required: false
            fields:
              - name: page_type
                label: Page type
                widget: select
                options:
                  - WebPage
                  - AboutPage
                  - ContactPage
                  - FAQPage
                  - CollectionPage
                  - ProfilePage
                default: WebPage
                required: false
                hint: >-
                  Person, WebSite, Breadcrumbs, FAQ and Service / Article / Video schema are generated automatically. This only sets the
                  page type.
              - name: custom_jsonld
                label: Custom JSON-LD (optional)
                widget: code
                default_language: json
                allow_language_selection: false
                output_code_only: true
                required: false
                hint: Paste extra schema.org JSON-LD for this page. Invalid JSON is skipped instead of breaking the site.

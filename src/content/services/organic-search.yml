  eyebrow: Organic Search
  heading: Traffic you own, not traffic you rent.
  subheading: Organic search is no longer just "ranking on Google". It's being found in classic results, being the direct answer, being cited by AI, and showing up on the map. I help brands do all four — as one strategy, not four separate projects.
  primary_label: Talk to me

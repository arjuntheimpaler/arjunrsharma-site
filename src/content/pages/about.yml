sections:
  - type: text
    heading: ''
    body: |-
      I've spent four years doing agency-side SEO and growth marketing across FMCG, BFSI, Travel, B2B — working inside teams that had to prove organic channel performance against hard revenue numbers, not just rankings.

      I currently lead growth marketing at Jump Content (Dimerse). This site is where I keep a record of the brands I've worked with, and write about the parts of SEO that are actually changing right now — Local SEO, generative engine optimization (GEO), answer engine optimization (AEO), and organic growth strategy more broadly.

      No fluff, no recycled "10 SEO tips" posts — just what I'm seeing work (and not work) in practice, and the projects behind it.
